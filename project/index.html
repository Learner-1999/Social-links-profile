<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Social links profile</title>
  </head>
  <body>
    <main class="card">
      <section>
        <div>
          <img src="./images/avatar.png" alt="Avatar of Jessica Randall" />
        </div>
        <p class="name">Jessica Randall</p>
        <p class="address">London, United Kingdom</p>
        <p>"Front-end developer and avid reader."</p>
      </section>
      <nav class="socials">
        <p>Github</p>
        <p>Frontend Mentor</p>
        <p>Linkedin</p>
        <p>Twitter</p>
        <p>Instagram</p>
      </nav>
    </main>
  </body>
</html>
